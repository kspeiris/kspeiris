name: Daily Profile Activity

on:
  schedule:
    - cron: "15 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "Kavindu Peiris"
          git config user.email "kavindup52@gmail.com"

      - name: Generate random commit count
        id: count
        run: |
          COUNT=$((RANDOM % 6 + 7))
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Today's commits: $COUNT"

      - name: Create automated commits
        run: |
          COUNT=${{ steps.count.outputs.count }}

          for i in $(seq 1 $COUNT)
          do
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

            export TIMESTAMP
            python3 - <<'PY'
import os
import re
from pathlib import Path

path = Path("README.md")
text = path.read_text(encoding="utf-8")
timestamp = os.environ.get("TIMESTAMP", "")

text = re.sub(
    r'<!-- profile-automation:.*? -->',
    f'<!-- profile-automation: {timestamp} -->',
    text
)

path.write_text(text, encoding="utf-8")
PY

            git add README.md

            git commit -m "chore: profile maintenance $i/$COUNT"
            git pull --rebase origin main || true
            git push

            if [ "$i" -lt "$COUNT" ]; then
              DELAY=$((RANDOM % 300 + 120))
              echo "Waiting $DELAY seconds..."
              sleep "$DELAY"
            fi
          done
